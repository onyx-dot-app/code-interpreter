name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: onyxdotapp

jobs:
  build-executor:
    name: Build and Push Executor Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version from pyproject
        id: version
        run: echo "version=$(grep -m1 '^version = ' executor/pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/python-executor-sci
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push executor image
        uses: docker/build-push-action@v5
        with:
          context: ./executor
          file: ./executor/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-code-interpreter:
    name: Build and Push Code Interpreter Image
    runs-on: ubuntu-latest
    needs: build-executor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version from pyproject
        id: version
        run: echo "version=$(grep -m1 '^version = ' code-interpreter/pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/code-interpreter
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push code-interpreter image
        uses: docker/build-push-action@v5
        with:
          context: ./code-interpreter
          file: ./code-interpreter/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-code-interpreter-go:
    name: Build and Push Code Interpreter Go Images
    runs-on: ubuntu-latest
    needs: build-executor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read version from config
        id: version
        run: echo "version=$(grep -m1 'ServiceVersion = ' code-interpreter-go/internal/config/config.go | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # Default image: includes the Docker daemon so every deployment mode
      # works, including Docker-in-Docker.
      - name: Extract metadata (default)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/code-interpreter-go
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      # Slim image: no docker packages at all. Opt-in for Docker-out-of-Docker
      # (mounted socket) and Kubernetes deployments.
      - name: Extract metadata (slim)
        id: meta-slim
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/code-interpreter-go
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},suffix=-slim
            type=raw,value=${{ steps.version.outputs.version }}-slim
            type=raw,value=latest-slim

      - name: Build and push code-interpreter-go image (default)
        uses: docker/build-push-action@v5
        with:
          context: ./code-interpreter-go
          file: ./code-interpreter-go/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push code-interpreter-go image (slim)
        uses: docker/build-push-action@v5
        with:
          context: ./code-interpreter-go
          file: ./code-interpreter-go/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SKIP_NESTED_DOCKER=1
          tags: ${{ steps.meta-slim.outputs.tags }}
          labels: ${{ steps.meta-slim.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
