{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "code-interpreter.fullname" . }}
  labels:
    {{- include "code-interpreter.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  {{- if .Values.codeInterpreter.kubernetesExecutor.setOwnerReferences }}
  # Read this chart's own Deployment to build the executor pod ownerReference.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  {{- end }}
  {{- with .Values.rbac.additionalRules }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
